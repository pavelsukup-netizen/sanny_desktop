name: Check Sanny Desktop

on:
  push:
    branches: ["feature/sanny-desktop-0.4", "main"]
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run check
      - name: Check Python syntax
        run: python -m py_compile voice-engine/server.py
